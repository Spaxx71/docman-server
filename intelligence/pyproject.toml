[project]
name = "docman-intelligence"
version = "0.1.0"
description = "Liest Rechnungen und ordnet die Buchhaltungsfelder zu."
requires-python = ">=3.9"
dependencies = [
  "pypdfium2>=4.30,<6",
  "scikit-learn>=1.3,<2",
]

[project.scripts]
docman-intelligence = "docman_intelligence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
