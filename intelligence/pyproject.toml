[project]
name = "docman-intelligence"
version = "0.1.8"
description = "Liest Rechnungen und ordnet die Buchhaltungsfelder zu."
requires-python = ">=3.9"
dependencies = [
  "pypdfium2>=4.30,<6",
  "Pillow>=10,<12",
  "scikit-learn>=1.3,<2",
]

[tool.setuptools.package-data]
docman_intelligence = ["vocab.xml"]

[project.scripts]
docman-intelligence = "docman_intelligence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
