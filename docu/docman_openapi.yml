openapi: '3.0.3'
info:
  title: Docman RESTful API
  version: '1.0'
servers:
  - url: https://docman.io/api
    description: Standard URL
  - url: https://docman.bintellix.com/api
    description: bintellix URL
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    TenantsResponse:
      type: object
      properties:
        Tenants:
          type: object
          properties:
            version:
              type: string
            Tenant:
              type: array
              items:
                type: object
                properties:
                  version:
                    type: string
                  id:
                    type: string
                  priority:
                    type: string
                  Name:
                    type: string
      example: |
        <Tenants version="1.0">
            <Tenant version="1.0" id="test" priority="5">
                <Name>MyCompany</Name>
            </Tenant>
        </Tenants>
    TransferResponse:
      type: object
      properties:
        version:
          type: string
          example: "1.0"
        tenantId:
          type: string
          example: "bintellix"
        Files:
          type: array
          items:
            $ref: '#/components/schemas/File'
      example: |
        <Transfer version="1.0" tenantId="test">
          <Files>
            <File name="2021-01-31_ShopXY_Rechnung_123456.pdf" size="114595" created="2024-09-02T20:06:24.573+02:00"/>
          </Files>
        </Transfer>

    File:
      type: object
      properties:
        name:
          type: string
          example: "2021-01-31_Amazon_Lama_Rechnung_DE-028-2034509-1350706.pdf"
        size:
          type: integer
          example: 114595
        created:
          type: string
          format: date-time
        example: "2024-09-02T20:06:24.573+02:00"        
security:
  - basicAuth: []    
paths:
  /access/login:
    get:
      summary: do a login
